    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b829dd;
            --neon-yellow: #ffd700;
            --neon-green: #00ff88;
            --dark-bg: #0a0e27;
            --card-bg: rgba(10, 14, 39, 0.92);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            color: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 45, 149, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(184, 41, 221, 0.08) 0%, transparent 70%),
                var(--dark-bg);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .floating-icon {
            position: fixed;
            font-size: 2rem;
            opacity: 0.12;
            animation: float 6s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .container {
            max-width: 520px;
            width: 100%;
            position: relative;
            padding-bottom: 40px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        .header-icons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .header-icons span {
            animation: bounce 2s infinite;
        }

        .header-icons span:nth-child(2) { animation-delay: 0.3s; }
        .header-icons span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 3rem;
            line-height: 0.95;
            font-weight: 900;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .title-line1 {
            color: var(--neon-pink);
            text-shadow: 0 0 20px rgba(255,45,149,0.5), 0 0 40px rgba(255,45,149,0.3);
        }

        .title-line2 {
            color: var(--neon-yellow);
            text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(255,215,0,0.3);
        }

        .title-line3 {
            color: #ffffff;
            font-style: normal;
            font-size: 3.5rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.5), 0 0 40px rgba(0,212,255,0.3);
        }

        /* Column headers */
        .column-headers {
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px;
            gap: 8px;
            margin-bottom: 12px;
            padding: 0 15px;
        }

        .col-header {
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .col-header:nth-child(3) {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255,45,149,0.5);
        }

        .col-header:nth-child(4) {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        /* Platform Cards */
        .platforms-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .platform-card {
            display: grid;
            grid-template-columns: 50px 1fr 100px 100px;
            align-items: center;
            gap: 8px;
            padding: 12px 15px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            color: #ffffff;
        }

        .platform-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(135deg, var(--card-color), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .platform-card:hover::before {
            opacity: 1;
        }

        .platform-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .platform-card.active {
            grid-template-columns: 50px 1fr 100px 100px;
            grid-template-rows: auto auto;
            padding: 12px 15px;
            gap: 8px;
            cursor: default;
            z-index: 10;
            color: #ffffff;
        }

        .platform-card.active:hover {
            transform: none;
        }

        .platform-card.active::before {
            opacity: 1;
            background: linear-gradient(135deg, var(--card-color), var(--card-color-secondary, var(--card-color)));
        }

        .platform-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
            grid-column: 1;
            grid-row: 1;
        }

        .platform-card.active .platform-icon {
            width: 42px;
            height: 42px;
            font-size: 1.5rem;
            border-radius: 10px;
        }

        .platform-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
            grid-column: 2;
            grid-row: 1;
        }

        .platform-name {
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            line-height: 1.2;
            transition: font-size 0.3s ease;
        }

        .platform-card.active .platform-name {
            font-size: 1rem;
            color: #ffffff;
        }

        .platform-detail {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.85);
            font-weight: 400;
        }

        .platform-card.active .platform-detail {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.85);
        }

        .price-box {
            text-align: center;
            padding: 8px 5px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .platform-card.active .price-box {
            padding: 8px 5px;
            font-size: 1rem;
        }

        .price-monthly {
            background: rgba(255, 45, 149, 0.15);
            border: 1px solid rgba(255, 45, 149, 0.4);
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255,45,149,0.4);
            grid-column: 3;
            grid-row: 1;
        }

        .price-quarterly {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(255,215,0,0.4);
            grid-column: 4;
            grid-row: 1;
        }

        /* EXPANDED CONTENT */
        .card-expanded {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.4s ease 0.1s,
                        padding 0.4s ease;
            padding: 0;
            grid-column: 1 / -1;
            grid-row: 2;
            color: #ffffff;
        }

        .platform-card.active .card-expanded {
            max-height: 500px;
            opacity: 1;
            padding-top: 12px;
            color: #ffffff;
        }

        .expanded-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: #ffffff;
        }

        .expanded-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--card-color), transparent);
            opacity: 0.5;
            margin: 0 10px;
        }

        .expanded-section {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 0 5px;
            color: #ffffff;
        }

        .expanded-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            margin-top: 2px;
            color: #ffffff;
        }

        .expanded-text {
            flex: 1;
            color: #ffffff;
        }

        .expanded-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--card-color);
            margin-bottom: 3px;
            text-shadow: 0 0 8px var(--card-color-glow, var(--card-color));
        }

        .expanded-value {
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.5;
            font-weight: 500;
        }

        .expanded-value strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* Other cards when one is active */
        .platforms-list.has-active .platform-card:not(.active) {
            opacity: 0.4;
            transform: scale(0.95);
            pointer-events: none;
            filter: blur(1px);
        }

        /* CTA Section */
        .cta-section {
            margin-top: 25px;
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 50px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #0a0e27;
            font-weight: 900;
            font-size: 1.4rem;
            text-transform: uppercase;
            border-radius: 12px;
            text-decoration: none;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(0,255,136,0.4), 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0,255,136,0.6), 0 15px 40px rgba(0,0,0,0.4);
        }

        .contact-info {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .contact-info svg {
            width: 32px;
            height: 32px;
            fill: #25d366;
            filter: drop-shadow(0 0 10px rgba(37,211,102,0.5));
        }

        /* Platform specific colors */
        .netflix-red { --card-color: #e50914; --card-color-secondary: #ff1744; --card-color-glow: rgba(229,9,20,0.6); background: linear-gradient(135deg, #e50914, #b20710); }
        .netflix-red2 { --card-color: #e50914; --card-color-secondary: #ff1744; --card-color-glow: rgba(229,9,20,0.6); background: linear-gradient(135deg, #e50914, #b20710); }
        .disney-blue { --card-color: #113ccf; --card-color-secondary: #00a8e1; --card-color-glow: rgba(17,60,207,0.6); background: linear-gradient(135deg, #113ccf, #0a2472); }
        .universal-teal { --card-color: #00a8e1; --card-color-secondary: #00d4ff; --card-color-glow: rgba(0,168,225,0.6); background: linear-gradient(135deg, #00a8e1, #0077a3); }
        .hbo-purple { --card-color: #8b5cf6; --card-color-secondary: #a78bfa; --card-color-glow: rgba(139,92,246,0.6); background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .youtube-red { --card-color: #ff0000; --card-color-secondary: #ff4444; --card-color-glow: rgba(255,0,0,0.6); background: linear-gradient(135deg, #ff0000, #cc0000); }
        .prime-blue { --card-color: #00a8e1; --card-color-secondary: #00d4ff; --card-color-glow: rgba(0,168,225,0.6); background: linear-gradient(135deg, #00a8e1, #0077a3); }
        .crunchyroll-orange { --card-color: #f47521; --card-color-secondary: #ff8c42; --card-color-glow: rgba(244,117,33,0.6); background: linear-gradient(135deg, #f47521, #d45a0a); }
        .paramount-blue { --card-color: #0064ff; --card-color-secondary: #3385ff; --card-color-glow: rgba(0,100,255,0.6); background: linear-gradient(135deg, #0064ff, #0047b3); }

        /* Responsive */
        @media (max-width: 480px) {
            .title { font-size: 2.2rem; }
            .platform-card,
            .platform-card.active {
                grid-template-columns: 40px 1fr 85px 85px;
                padding: 10px;
                gap: 6px;
            }
            .platform-icon,
            .platform-card.active .platform-icon {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .platform-name,
            .platform-card.active .platform-name {
                font-size: 0.9rem;
            }
            .platform-detail,
            .platform-card.active .platform-detail {
                font-size: 0.7rem;
            }
            .price-box,
            .platform-card.active .price-box {
                font-size: 0.9rem;
                padding: 6px 3px;
            }
            .cta-button { font-size: 1.1rem; padding: 12px 35px; }
            .contact-info { font-size: 1.1rem; }
            .expanded-value { font-size: 0.85rem; }
            .column-headers { grid-template-columns: 40px 1fr 85px 85px; padding: 0 10px; }
        }
    </style>

                planName: 'Paramount+ con SHOWTIME',
                planDescription: 'Plan Premium con SHOWTIME incluido, 4K UHD, HDR10, Dolby Vision y descargas offline.',
                hasPin: false,
                pinNote: 'Cuenta compartida. Paramount+ no permite PIN por perfil, pero tu perfil es privado y solo vos lo usás.'
            }
        ];

        // ═══════════════════════════════════════════════════════════════════════
        // FIN DE EDICIÓN DE DATOS
        // ═══════════════════════════════════════════════════════════════════════

        let activeCardId = null;

        function getPinSection(platform) {
            if (platform.hasPin) {
                return `
                    <div class="expanded-section">
                        <div class="expanded-icon">🔒</div>
                        <div class="expanded-text">
                            <div class="expanded-label">Seguridad del Perfil</div>
                            <div class="expanded-value">
                                ${platform.pinNote}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="expanded-section">
                        <div class="expanded-icon">👤</div>
                        <div class="expanded-text">
                            <div class="expanded-label">Acceso a la Cuenta</div>
                            <div class="expanded-value">
                                ${platform.pinNote}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderPlatforms() {
            const container = document.getElementById('platformsList');
            container.innerHTML = platformsData.map(platform => `
                <div class="platform-card" data-id="${platform.id}" onclick="toggleCard('${platform.id}')">
                    <div class="platform-icon ${platform.iconClass}">${platform.iconText}</div>
                    <div class="platform-info">
                        <div class="platform-name">${platform.name}</div>
                        ${platform.detail ? `<div class="platform-detail">${platform.detail}</div>` : ''}
                    </div>
                    <div class="price-box price-monthly">${platform.monthlyPrice}</div>
                    <div class="price-box price-quarterly">${platform.quarterlyPrice}</div>
                    <div class="card-expanded">
                        <div class="expanded-divider"></div>
                        <div class="expanded-content">
                            <div class="expanded-section">
                                <div class="expanded-icon">🏆</div>
                                <div class="expanded-text">
                                    <div class="expanded-label">Plan Incluido</div>
                                    <div class="expanded-value"><strong>${platform.planName}</strong></div>
                                </div>
                            </div>
                            <div class="expanded-section">
                                <div class="expanded-icon">📋</div>
                                <div class="expanded-text">
                                    <div class="expanded-label">Qué incluye</div>
                                    <div class="expanded-value">${platform.planDescription}</div>
                                </div>
                            </div>
                            ${platform.hasPin ? `
                            <div class="expanded-section">
                                <div class="expanded-icon">👤</div>
                                <div class="expanded-text">
                                    <div class="expanded-label">Tipo de Cuenta</div>
                                    <div class="expanded-value">
                                        <strong>Cuenta compartida</strong> — Vos accedés a un perfil privado dentro de una cuenta principal.
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            ${getPinSection(platform)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCard(id) {
            const container = document.getElementById('platformsList');
            const allCards = container.querySelectorAll('.platform-card');

            if (activeCardId === id) {
                closeCard();
                return;
            }

            allCards.forEach(card => card.classList.remove('active'));
            container.classList.remove('has-active');

            const targetCard = container.querySelector(`[data-id="${id}"]`);
            if (targetCard) {
                targetCard.classList.add('active');
                container.classList.add('has-active');
                activeCardId = id;

                setTimeout(() => {
                    const rect = targetCard.getBoundingClientRect();
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    const cardTop = rect.top + scrollTop;
                    const viewportHeight = window.innerHeight;
                    const cardHeight = rect.height;
                    const targetScroll = cardTop - (viewportHeight / 2) + (cardHeight / 2);

                    window.scrollTo({
                        top: Math.max(0, targetScroll),
                        behavior: 'smooth'
                    });
                }, 100);
            }
        }

        function closeCard() {
            const container = document.getElementById('platformsList');
            const allCards = container.querySelectorAll('.platform-card');
            allCards.forEach(card => card.classList.remove('active'));
            container.classList.remove('has-active');
            activeCardId = null;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCard();
        });

        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                starsContainer.appendChild(star);
            }
        }

        renderPlatforms();
        generateStars();
    </script>
</body>
</html>
